}

branchBuildVersions.each { version ->
    String suffix = taskSuffixForMinecraftVersion(version)
    tasks.register("branchJarsForMinecraft${suffix}", GradleBuild) {
        group = "branch"
        description = "Builds branch jars that require Minecraft ${version}."
        buildName = "branch-jars-${version}"
        dir = projectDir
        tasks = ["branchJars"]
        startParameter.projectCacheDir = file(".gradle-branch/${version}")
        startParameter.projectProperties = [
                "skipBranchAutoBuild": "true",
                "minecraft_version": version,
                "paper_dependency_version": paperDependencyForMinecraftVersion(version),
                "java": javaVersionForMinecraftVersion(version).toString()
        ]
    }

    tasks.register("publishBranchModulesToLocalForMinecraft${suffix}", GradleBuild) {
        group = "publishing"
        description = "Publishes branch modules that require Minecraft ${version} to the local branch repo."
        buildName = "publish-local-branch-${version}"
        dir = projectDir
        tasks = ["publishBranchModulesToLocal"]
        startParameter.projectCacheDir = file(".gradle-branch/${version}")
        startParameter.projectProperties = [
                "skipBranchAutoBuild": "true",
                "minecraft_version": version,
                "paper_dependency_version": paperDependencyForMinecraftVersion(version),
                "java": javaVersionForMinecraftVersion(version).toString(),
                "branch.publish.force": forceBranchPublish.toString()
        ]
    }

    tasks.register("publishBranchModulesToGitHubForMinecraft${suffix}", GradleBuild) {
        group = "publishing"
        description = "Publishes branch modules that require Minecraft ${version} to the configured Maven repo."
        buildName = "publish-remote-branch-${version}"
        dir = projectDir
        tasks = ["publishBranchModulesToGitHub"]
        startParameter.projectCacheDir = file(".gradle-branch/${version}")
        startParameter.projectProperties = [
                "skipBranchAutoBuild": "true",
                "minecraft_version": version,
                "paper_dependency_version": paperDependencyForMinecraftVersion(version),
                "java": javaVersionForMinecraftVersion(version).toString(),
                "branch.publish.force": forceBranchPublish.toString()
        ]
        if (providers.gradleProperty("gpr.repoUrl").present) {
            startParameter.projectProperties["gpr.repoUrl"] = providers.gradleProperty("gpr.repoUrl").get()
        }
        if (providers.gradleProperty("gpr.user").present) {
            startParameter.projectProperties["gpr.user"] = providers.gradleProperty("gpr.user").get()
        }
        if (providers.gradleProperty("gpr.key").present) {
            startParameter.projectProperties["gpr.key"] = providers.gradleProperty("gpr.key").get()
        }
        if (providers.gradleProperty("mavenServerId").present) {
            startParameter.projectProperties["mavenServerId"] = providers.gradleProperty("mavenServerId").get()
        }
        if (providers.gradleProperty("maven.settings.file").present) {
            startParameter.projectProperties["maven.settings.file"] = providers.gradleProperty("maven.settings.file").get()
        }
    }
}

tasks.register("branchJars") {
    if (skipBranchAutoBuild) {
        dependsOn(compatibleBranchModules.collect { branch ->
            String capitalizedTaskName = branch.taskName.split("_").collect { it.capitalize() }.join("")
            tasks.named("branchJar${capitalizedTaskName}")
        })
    } else {
        dependsOn(branchBuildVersions.collect { version ->
            tasks.named("branchJarsForMinecraft${taskSuffixForMinecraftVersion(version)}")
        })
    }
}

tasks.register("publishBranchModulesToLocal") {
    if (skipBranchAutoBuild) {
        dependsOn(compatibleBranchModules.collect { branch ->
            String capitalizedTaskName = branch.taskName.split("_").collect { it.capitalize() }.join("")
            tasks.named("publishBranch${capitalizedTaskName}PublicationToLocalBranchRepoRepository")
        })
    } else {
        dependsOn(branchBuildVersions.collect { version ->
            tasks.named("publishBranchModulesToLocalForMinecraft${taskSuffixForMinecraftVersion(version)}")
        })
    }
}

tasks.register("publishBranchModulesToGitHub") {
    if (skipBranchAutoBuild) {
        dependsOn(compatibleBranchModules.collect { branch ->
            String capitalizedTaskName = branch.taskName.split("_").collect { it.capitalize() }.join("")
            tasks.named("publishBranch${capitalizedTaskName}PublicationToGitHubPackagesRepository")
        })
    } else {
        dependsOn(branchBuildVersions.collect { version ->
            tasks.named("publishBranchModulesToGitHubForMinecraft${taskSuffixForMinecraftVersion(version)}")
        })
    }
}

compatibleBranchModules.each { branch ->
    String capitalizedTaskName = branch.taskName.split("_").collect { it.capitalize() }.join("")
    tasks.named("publishBranch${capitalizedTaskName}PublicationToLocalBranchRepoRepository") {
        onlyIf {
            if (forceBranchPublish) {
                return true
            }
            def artifactPath = layout.buildDirectory.dir("branch-repo").get().asFile.toPath()
                    .resolve("xuan/cat/fartherviewdistance")
                    .resolve("fartherviewdistance-branch-${branch.minecraftVersion}")
                    .resolve(branch.branchVersion)
                    .resolve("fartherviewdistance-branch-${branch.minecraftVersion}-${branch.branchVersion}.jar")
            boolean exists = artifactPath.toFile().isFile()
            if (exists) {
                logger.lifecycle("Skipping already published local branch artifact {}", artifactPath)
            }
            return !exists
        }
    }

    tasks.named("publishBranch${capitalizedTaskName}PublicationToGitHubPackagesRepository") {
        onlyIf {
            if (forceBranchPublish) {
                return true
            }
            String repositoryUrl = providers.gradleProperty("gpr.repoUrl").orElse(githubPackagesRepoUrl).get()
            String user = resolvedGprUser
            String key = resolvedGprKey
            String artifactId = "fartherviewdistance-branch-${branch.minecraftVersion}"
            String artifactUrl = remoteArtifactUrl(repositoryUrl, "xuan.cat.fartherviewdistance", artifactId,
                    branch.branchVersion)
            boolean exists = remoteArtifactExists(artifactUrl, user, key)
            if (exists) {
                logger.lifecycle("Skipping already published remote branch artifact {}", artifactUrl)
            }
            return !exists
        }
    }
}

tasks.register("publishBranchModulesForCurrentMinecraftToLocal") {
    dependsOn(compatibleBranchModules.collect { branch ->
        String capitalizedTaskName = branch.taskName.split("_").collect { it.capitalize() }.join("")
        tasks.named("publishBranch${capitalizedTaskName}PublicationToLocalBranchRepoRepository")
    })
}

tasks.register("publishBranchModulesForCurrentMinecraftToGitHub") {
    dependsOn(compatibleBranchModules.collect { branch ->
        String capitalizedTaskName = branch.taskName.split("_").collect { it.capitalize() }.join("")
        tasks.named("publishBranch${capitalizedTaskName}PublicationToGitHubPackagesRepository")
    })
}

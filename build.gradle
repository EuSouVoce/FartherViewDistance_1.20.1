def compatibleBranchModules = branchModules.findAll { branch -> branch.requiresMinecraftVersion == minecraftVersion }
def branchBuildVersions = branchModules.collect { it.requiresMinecraftVersion }.unique().sort()

def paperDependencyForMinecraftVersion = { String version ->
    return version.startsWith("26.") ? "${version}.build.+" : "${version}-R0.1-SNAPSHOT"
}

def javaVersionForMinecraftVersion = { String version ->
    return version.startsWith("26.") ? 25 : defaultJavaVersion
}

def taskSuffixForMinecraftVersion = { String version ->
    return version.replaceAll("[^A-Za-z0-9]", "_")
            .split("_")
            .findAll { !it.isBlank() }
            .collect { it.capitalize() }
            .join("")
}

def remoteArtifactUrl = { String repositoryUrl, String groupId, String artifactId, String version ->
    String normalized = repositoryUrl.endsWith("/") ? repositoryUrl : repositoryUrl + "/"
    return normalized + groupId.replace(".", "/") + "/" + artifactId + "/" + version + "/"
            + artifactId + "-" + version + ".jar"
}

def remoteArtifactExists = { String artifactUrl, String user, String key ->
    HttpURLConnection connection = null
    try {
        connection = (HttpURLConnection) new URL(artifactUrl).openConnection()
        connection.setRequestMethod("HEAD")
        connection.setConnectTimeout(3500)
        connection.setReadTimeout(3500)
        connection.setRequestProperty("User-Agent", "FartherViewDistance-Gradle-PublishCheck")
        if (user?.trim() && key?.trim()) {
            String basic = "${user}:${key}"
            connection.setRequestProperty("Authorization", "Basic " + basic.bytes.encodeBase64().toString())
        }
        int status = connection.responseCode
        return status >= 200 && status < 300
    } catch (IOException ignored) {
        return false
    } finally {
        connection?.disconnect()
    }
}

def resolveMavenServerCredentials = { String settingsFilePath, String serverId ->
    if (!(settingsFilePath?.trim()) || !(serverId?.trim())) {
        return [username: "", password: "", loaded: false, source: ""]
    }
    File settingsFile = file(settingsFilePath)
    if (!settingsFile.isFile()) {
        return [username: "", password: "", loaded: false, source: settingsFile.absolutePath]
    }
    try {
        def xml = new groovy.xml.XmlSlurper(false, true).parse(settingsFile)
        def localName = { Object nodeName ->
            if (nodeName == null) {
                return ""
            }
            if (nodeName instanceof groovy.namespace.QName) {
                return nodeName.localPart ?: ""
            }
            String asString = nodeName.toString()
            if (asString.contains("}")) {
                return asString.substring(asString.lastIndexOf("}") + 1)
            }
            if (asString.contains(":")) {
                return asString.substring(asString.lastIndexOf(":") + 1)
            }
            return asString
        }

        def serverNodes = xml.'**'.findAll { localName(it.name()) == "server" }
        def server = serverNodes.find {
            def idNode = it.children().find { child -> localName(child.name()) == "id" }
            return idNode?.text() == serverId
        }
        if (server == null) {
            return [username: "", password: "", loaded: false, source: settingsFile.absolutePath]
        }

        def usernameNode = server.children().find { child -> localName(child.name()) == "username" }
        def passwordNode = server.children().find { child -> localName(child.name()) == "password" }
        return [
                username: usernameNode?.text() ?: "",
                password: passwordNode?.text() ?: "",
                loaded  : true,
                source  : settingsFile.absolutePath
        ]
    } catch (Exception ignored) {
        return [username: "", password: "", loaded: false, source: settingsFile.absolutePath]
    }
}

String mavenServerId = providers.gradleProperty("mavenServerId").orElse("").get()
String mavenSettingsFilePath = providers.gradleProperty("maven.settings.file").orNull
if (!(mavenSettingsFilePath?.trim())) {
    mavenSettingsFilePath = System.getenv("MAVEN_SETTINGS_PATH")
}
if (!(mavenSettingsFilePath?.trim())) {
    mavenSettingsFilePath = new File(System.getProperty("user.home"), ".m2/settings.xml").absolutePath
}
def mavenServerCredentials = resolveMavenServerCredentials(mavenSettingsFilePath, mavenServerId)
String resolvedGprUser = providers.gradleProperty("gpr.user")
        .orElse(mavenServerCredentials.username)
        .orElse(System.getenv("GITHUB_ACTOR") ?: "")
        .get()
String resolvedGprKey = providers.gradleProperty("gpr.key")
        .orElse(mavenServerCredentials.password)
        .orElse(System.getenv("GITHUB_TOKEN") ?: "")
        .get()

if (mavenServerId && mavenServerCredentials.loaded) {
    logger.lifecycle("Loaded Maven credentials from {} for server id '{}'", mavenServerCredentials.source, mavenServerId)
} else if (mavenServerId && !providers.gradleProperty("gpr.user").present && !providers.gradleProperty("gpr.key").present) {
    logger.warn("Maven server id '{}' not found or unreadable in {}. Falling back to gpr.user/gpr.key or environment variables.",
            mavenServerId, mavenSettingsFilePath)
}


tasks.register("generateBranchProviders") {
    outputs.dir(generatedBranchProviderDir)
    outputs.dir(generatedBranchServiceDir)
    doLast {
        branchModules.each { branch ->
            String providerClassName = "${branch.packageName}.${branch.className}"
            File packageDirectory = generatedBranchProviderDir.get().file(branch.packageName.replace(".", "/")).asFile
            packageDirectory.mkdirs()
            new File(packageDirectory, "${branch.className}.java").text = """package ${branch.packageName};

import xuan.cat.fartherviewdistance.api.branch.BranchMinecraft;
import xuan.cat.fartherviewdistance.api.branch.BranchPacket;
import xuan.cat.fartherviewdistance.code.branch.BranchProvider;

public final class ${branch.className} implements BranchProvider {
    @Override
    public String id() {
        return "external-${branch.minecraftVersion}";
    }

    @Override
    public String branchVersion() {
        return "${branch.branchVersion}";
    }

    @Override
    public boolean supportsMinecraftVersion(final String minecraftVersion) {
        return "${branch.minecraftVersion}".equals(minecraftVersion);
    }

    @Override
    public BranchMinecraft createMinecraft() {
        return new xuan.cat.fartherviewdistance.code.branch.MinecraftCode();
    }

    @Override
    public BranchPacket createPacket() {
        return new xuan.cat.fartherviewdistance.code.branch.PacketCode();
    }
}
"""
            File serviceDirectory = generatedBranchServiceDir.get().dir(branch.taskName).dir("META-INF/services").asFile
            serviceDirectory.mkdirs()
            new File(serviceDirectory, "xuan.cat.fartherviewdistance.code.branch.BranchProvider").text = providerClassName + System.lineSeparator()
        }
    }
}

tasks.named("compileBranchProviderJava") {
    dependsOn("generateBranchProviders")
}

branchModules.each { branch ->
    String capitalizedTaskName = branch.taskName.split("_").collect { it.capitalize() }.join("")
    tasks.register("branchJar${capitalizedTaskName}", Jar) {
        dependsOn("compileBranchProviderJava")
        doFirst {
            if (branch.requiresMinecraftVersion != minecraftVersion) {
                throw new GradleException("Branch ${branch.minecraftVersion} must be built with "
                        + "-Pminecraft_version=${branch.requiresMinecraftVersion}; current minecraft_version="
                        + minecraftVersion)
            }
        }
        archiveBaseName = "fartherviewdistance-branch-${branch.minecraftVersion}"
        archiveVersion = branch.branchVersion
        from(sourceSets.branchProvider.output) {
            include branch.packageName.replace(".", "/") + "/**"
        }
        from(sourceSets.main.output) {
            include "xuan/cat/fartherviewdistance/code/branch/**"
            exclude "xuan/cat/fartherviewdistance/code/branch/BranchPluginLoader*"
            exclude "xuan/cat/fartherviewdistance/code/branch/BranchProvider*"
            exclude "xuan/cat/fartherviewdistance/code/branch/BranchResolver*"
            exclude "xuan/cat/fartherviewdistance/code/branch/BranchVersionCache*"
            exclude "xuan/cat/fartherviewdistance/code/branch/BuiltInBranchProvider*"
        }
        from(generatedBranchServiceDir.map { it.dir(branch.taskName) })
    }
}


name: Publish Branch Module

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: Maven repository URL to publish branch artifacts.
        required: false
        default: ''
      force_publish:
        description: Force publishing artifacts that already exist with the same version.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'branch-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle

      - name: Build core and branch jars
        run: ./gradlew --no-daemon clean jar

      - name: Publish branch modules
        env:
          INPUT_REPOSITORY_URL: ${{ inputs.repository_url }}
          DEFAULT_REPOSITORY_URL: ${{ format('https://maven.pkg.github.com/{0}', github.repository) }}
          GITHUB_MAVEN_USER: ${{ github.actor }}
          GITHUB_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_MAVEN_USER: ${{ secrets.BRANCH_MAVEN_USER }}
          BRANCH_MAVEN_PASSWORD: ${{ secrets.BRANCH_MAVEN_PASSWORD }}
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
        run: |
          if [ -n "${INPUT_REPOSITORY_URL}" ]; then
            repository_url="${INPUT_REPOSITORY_URL}"
            maven_user="${BRANCH_MAVEN_USER:-${GITHUB_MAVEN_USER}}"
            maven_password="${BRANCH_MAVEN_PASSWORD:-${GITHUB_MAVEN_PASSWORD}}"
          else
            repository_url="${DEFAULT_REPOSITORY_URL}"
            maven_user="${GITHUB_MAVEN_USER}"
            maven_password="${GITHUB_MAVEN_PASSWORD}"
          fi

          args=(
            publishBranchModulesToGitHub
            "-Pgpr.repoUrl=${repository_url}"
            "-Pgpr.user=${maven_user}"
            "-Pgpr.key=${maven_password}"
          )
          if [ "${FORCE_PUBLISH}" = "true" ]; then
            args+=("-Pbranch.publish.force=true")
          fi
          ./gradlew --no-daemon "${args[@]}"
